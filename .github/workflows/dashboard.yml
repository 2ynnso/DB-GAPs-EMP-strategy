name: Build and Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "framework/**"
      - "scripts/**"
      - ".github/workflows/dashboard.yml"
      - "README.md"
      - "docs/04-deploy/**"
  schedule:
    # 17:30 KST on weekdays, after the Korean market close.
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ETF master
        run: python3 scripts/build-etf-master.py

      - name: Update momentum from price API
        run: python3 scripts/update-momentum.py

      - name: Validate ETF master
        run: |
          python3 - <<'PY'
          import csv

          with open("framework/etf-master.csv", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          selected = [row for row in rows if row["selected"] == "Y"]
          total_weight = sum(float(row["target_weight"]) for row in selected)

          assert len(rows) == 188, f"expected 188 ETF rows, got {len(rows)}"
          assert len(selected) == 16, f"expected 16 selected ETFs, got {len(selected)}"
          assert round(total_weight, 6) == 100, f"expected selected weight 100, got {total_weight}"
          print("ETF master validation passed")
          PY

      - name: Validate momentum dashboard data
        run: |
          python3 - <<'PY'
          import csv

          required = [
              "one_month_return",
              "three_month_return",
              "six_month_return",
              "above_20d_ma",
              "above_60d_ma",
              "drawdown_from_60d_high",
              "relative_rank",
              "cluster_score",
              "price_data_as_of",
          ]

          with open("framework/weekly-monitoring-dashboard.csv", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert len(rows) == 8, f"expected 8 monitoring clusters, got {len(rows)}"
          for row in rows:
              missing = [field for field in required if not row.get(field)]
              assert not missing, f"{row['cluster']} missing fields: {missing}"
          print("Momentum validation passed")
          PY

      - name: Build dashboard
        run: python3 scripts/build-dashboard.py

      - name: Commit updated momentum data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framework/weekly-monitoring-dashboard.csv framework/etf-master.csv
          if git diff --cached --quiet; then
            echo "No momentum data changes to commit"
          else
            git commit -m "Update momentum dashboard data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
